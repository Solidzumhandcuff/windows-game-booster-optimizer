<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#0a0e1a"/>
<stop offset="55%" stop-color="#0d1424"/>
<stop offset="100%" stop-color="#081018"/>
</linearGradient>
<linearGradient id="boost" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#00e5ff"/>
<stop offset="100%" stop-color="#39ff88"/>
</linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#26d9ff" stop-opacity="0.55"/>
<stop offset="100%" stop-color="#26d9ff" stop-opacity="0"/>
</radialGradient>
<linearGradient id="needleGrad" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#ff6b3d"/>
<stop offset="100%" stop-color="#ffd23d"/>
</linearGradient>
<radialGradient id="dialFace" cx="50%" cy="45%" r="65%">
<stop offset="0%" stop-color="#132038"/>
<stop offset="100%" stop-color="#060a12"/>
</radialGradient>
</defs>

<rect x="0" y="0" width="1200" height="360" fill="url(#bg)"/>

<g opacity="0.14" stroke="#3fa9ff" stroke-width="1">
<line x1="0" y1="40" x2="1200" y2="40"/>
<line x1="0" y1="90" x2="1200" y2="90"/>
<line x1="0" y1="140" x2="1200" y2="140"/>
<line x1="0" y1="190" x2="1200" y2="190"/>
<line x1="0" y1="240" x2="1200" y2="240"/>
<line x1="0" y1="290" x2="1200" y2="290"/>
<line x1="150" y1="0" x2="150" y2="360"/>
<line x1="350" y1="0" x2="350" y2="360"/>
<line x1="550" y1="0" x2="550" y2="360"/>
<line x1="750" y1="0" x2="750" y2="360"/>
<line x1="950" y1="0" x2="950" y2="360"/>
<line x1="1150" y1="0" x2="1150" y2="360"/>
</g>

<circle cx="960" cy="185" r="230" fill="url(#glow)"/>

<g opacity="0.5">
<polygon points="60,340 200,340 120,300" fill="#123054" opacity="0.4"/>
<polygon points="1000,20 1140,20 1080,60" fill="#123054" opacity="0.35"/>
</g>

<g stroke="url(#boost)" stroke-width="2" opacity="0.55" fill="none">
<path d="M40 60 L140 60" stroke-linecap="round"/>
<path d="M40 80 L110 80" stroke-linecap="round"/>
<path d="M40 100 L90 100" stroke-linecap="round"/>
<path d="M40 300 L140 300" stroke-linecap="round"/>
<path d="M40 280 L110 280" stroke-linecap="round"/>
<path d="M40 260 L90 260" stroke-linecap="round"/>
</g>

<g transform="translate(960,190)">
<circle r="150" fill="url(#dialFace)" stroke="#1e5c8f" stroke-width="3"/>
<circle r="150" fill="none" stroke="#2fd4ff" stroke-width="1" opacity="0.5"/>
<circle r="130" fill="none" stroke="#0f2a44" stroke-width="18" opacity="0.6"/>

<g stroke="#4fd8ff" stroke-width="2" opacity="0.8">
<line x1="0" y1="-128" x2="0" y2="-112" transform="rotate(-120)"/>
<line x1="0" y1="-128" x2="0" y2="-112" transform="rotate(-90)"/>
<line x1="0" y1="-128" x2="0" y2="-112" transform="rotate(-60)"/>
<line x1="0" y1="-128" x2="0" y2="-112" transform="rotate(-30)"/>
<line x1="0" y1="-128" x2="0" y2="-112" transform="rotate(0)"/>
<line x1="0" y1="-128" x2="0" y2="-112" transform="rotate(30)"/>
<line x1="0" y1="-128" x2="0" y2="-112" transform="rotate(60)"/>
<line x1="0" y1="-128" x2="0" y2="-112" transform="rotate(90)"/>
<line x1="0" y1="-128" x2="0" y2="-112" transform="rotate(120)"/>
</g>

<path d="M -110 60 A 130 130 0 0 1 90 -95" fill="none" stroke="url(#boost)" stroke-width="8" stroke-linecap="round" opacity="0.9"/>

<g transform="rotate(65)">
<polygon points="0,-110 8,10 -8,10" fill="url(#needleGrad)"/>
<circle r="12" fill="#ffd23d"/>
</g>
<circle r="6" fill="#0a1420" stroke="#4fd8ff" stroke-width="1.5"/>

<text x="0" y="90" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" fill="#7ef2ff" text-anchor="middle">FPS</text>
</g>

<g transform="translate(1010,60)" opacity="0.85">
<circle cx="0" cy="0" r="4" fill="#39ff88"/>
<circle cx="18" cy="-10" r="3" fill="#26d9ff"/>
<circle cx="-14" cy="-16" r="2.5" fill="#7ef2ff"/>
<circle cx="30" cy="10" r="2" fill="#39ff88"/>
</g>
<g transform="translate(880,300)" opacity="0.7">
<circle cx="0" cy="0" r="3" fill="#26d9ff"/>
<circle cx="20" cy="8" r="2" fill="#39ff88"/>
</g>

<rect x="58" y="0" width="6" height="360" fill="url(#boost)" opacity="0.85"/>

<text x="70" y="150" font-family="'Segoe UI', Arial, sans-serif" font-size="66" font-weight="800" fill="#f2fbff" letter-spacing="0.5">
<tspan x="70" dy="0" textLength="720" lengthAdjust="spacingAndGlyphs">Windows Game Booster</tspan>
<tspan x="70" dy="76" textLength="380" lengthAdjust="spacingAndGlyphs" fill="#39ff88">Ultimate</tspan>
</text>

<text x="70" y="270" font-family="'Segoe UI', Arial, sans-serif" font-size="23" fill="#a8c4d8" textLength="720" lengthAdjust="spacingAndGlyphs">
No more manual tweaking — just run and go with peak FPS instantly
</text>

<g transform="translate(70,300)" opacity="0.9">
<rect x="0" y="0" width="14" height="8" fill="#39ff88"/>
<rect x="18" y="0" width="14" height="8" fill="#26d9ff"/>
<rect x="0" y="12" width="14" height="8" fill="#26d9ff"/>
<rect x="18" y="12" width="14" height="8" fill="#39ff88"/>
</g>
</svg>